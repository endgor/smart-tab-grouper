<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tab Grouper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Smart Tab Grouper</h1>
    </header>

    <div class="actions">
      <button id="groupBtn" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        Group by Domain
      </button>
      <button id="ungroupBtn" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </svg>
        Ungroup All
      </button>
    </div>

    <div class="divider"></div>

    <div class="settings">
      <h2>Settings</h2>

      <label class="setting">
        <span class="setting-info">
          <span class="setting-label">Auto-group new tabs</span>
          <span class="setting-desc">Group tabs by site as you browse</span>
        </span>
        <input type="checkbox" id="autoGroup" class="toggle">
      </label>

      <label class="setting">
        <span class="setting-info">
          <span class="setting-label">Auto-collapse groups</span>
          <span class="setting-desc">Collapse other groups when switching tabs</span>
        </span>
        <input type="checkbox" id="autoCollapse" class="toggle">
      </label>

      <label class="setting">
        <span class="setting-info">
          <span class="setting-label">Ungroup orphaned tabs</span>
          <span class="setting-desc">Ungroup when only 1 tab remains in a group</span>
        </span>
        <input type="checkbox" id="autoUngroupOrphans" class="toggle">
      </label>

      <label class="setting">
        <span class="setting-info">
          <span class="setting-label">Group colors</span>
          <span class="setting-desc" id="colorModeDesc">Cycle through the palette</span>
        </span>
        <select id="colorMode" class="select-input">
          <option value="auto">Auto</option>
          <option value="fixed">Single color</option>
          <option value="default">Chrome default</option>
        </select>
      </label>

      <label class="setting setting-sub" id="fixedColorSetting">
        <span class="setting-info">
          <span class="setting-label">Color</span>
        </span>
        <span class="color-select">
          <span class="color-swatch" id="fixedColorSwatch"></span>
          <select id="fixedColor" class="select-input">
            <option value="grey">Grey</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>
            <option value="yellow">Yellow</option>
            <option value="green">Green</option>
            <option value="pink">Pink</option>
            <option value="purple">Purple</option>
            <option value="cyan">Cyan</option>
            <option value="orange">Orange</option>
          </select>
        </span>
      </label>

      <details class="advanced" id="advanced">
        <summary>Advanced</summary>

        <label class="setting">
          <span class="setting-info">
            <span class="setting-label">Min tabs to auto-group</span>
            <span class="setting-desc">Tabs from one site before a group is made</span>
          </span>
          <input type="number" id="minTabsToGroup" class="number-input" min="2" max="10" value="2">
        </label>

        <label class="setting">
          <span class="setting-info">
            <span class="setting-label">Group by subdomain</span>
            <span class="setting-desc">Separate groups for each subdomain</span>
          </span>
          <input type="checkbox" id="groupBySubdomain" class="toggle">
        </label>

        <label class="setting" id="collapseDelaySetting">
          <span class="setting-info">
            <span class="setting-label">Collapse delay (ms)</span>
            <span class="setting-desc">Wait before collapsing (0 = instant)</span>
          </span>
          <input type="number" id="collapseDelay" class="number-input number-input-wide" min="0" max="5000" step="100" value="0">
        </label>
      </details>
    </div>

    <div class="divider"></div>

    <div class="excluded-domains">
      <h2>Excluded Domains</h2>
      <p class="hint">These domains won't be grouped</p>

      <button id="excludeCurrentBtn" class="btn btn-secondary btn-small" type="button">
        Exclude current site<span id="excludeCurrentDomain" class="btn-detail"></span>
      </button>

      <div class="add-domain">
        <input type="text" id="newDomain" placeholder="e.g. google.com" autocomplete="off">
        <button id="addDomainBtn" class="btn-icon" title="Add domain">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>

      <ul id="excludedList" class="excluded-list"></ul>
    </div>

    <footer>
      <span id="shortcutMac" class="shortcut" style="display:none">
        <kbd>⌘</kbd><kbd>⇧</kbd><kbd>K</kbd> to group
      </span>
      <span id="shortcutOther" class="shortcut" style="display:none">
        <kbd>Ctrl</kbd><kbd>⇧</kbd><kbd>K</kbd> to group
      </span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
